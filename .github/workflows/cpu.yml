name: CPU contracts
on: [push, pull_request]
jobs:
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/test_arm_target_increment.py tests/test_baseline_scope.py tests/test_gpu_binding.py tests/test_parallel_checkpoint.py tests/test_trajectory_heldout_split.py tests/test_robot_temporal_observation.py tests/test_architecture.py
        env:
          TORCH_DEVICE_BACKEND_AUTOLOAD: '0'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
